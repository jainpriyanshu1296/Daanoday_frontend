name: Deploy Daanoday Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: daanoday-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Deploy Daanoday Frontend
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

          cd /Users/priyanshujain/Daanoday_frontend

          echo "==> Backing up production environment"
          cp .env /tmp/daanoday-frontend.env

          echo "==> Fetching latest code"
          /usr/bin/git fetch origin main

          echo "==> Syncing production code"
          /usr/bin/git reset --hard origin/main

          echo "==> Restoring production environment"
          cp /tmp/daanoday-frontend.env .env

          echo "==> Installing dependencies"
          /opt/homebrew/bin/npm install

          echo "==> Building frontend"
          /opt/homebrew/bin/npm run build

          echo "==> Restarting Daanoday frontend"
          /opt/homebrew/bin/pm2 restart daanoday-frontend --update-env

          echo "==> Deployment completed"
          /opt/homebrew/bin/pm2 status daanoday-frontend
